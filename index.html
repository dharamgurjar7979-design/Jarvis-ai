<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI Assistant</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #02070d;
    color: #00eaff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}

.title {
    font-size: 42px;
    letter-spacing: 8px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px #00eaff;
}

.subtitle {
    color: #8defff;
    margin-bottom: 35px;
}

.orb {
    width: 190px;
    height: 190px;
    margin: auto;
    border-radius: 50%;
    border: 4px solid #00eaff;

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow:
        0 0 20px #00eaff,
        0 0 50px #0077ff,
        inset 0 0 30px #00eaff;

    animation: pulse 2s infinite;
}

.orb.listening {
    animation: listening 0.7s infinite alternate;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

@keyframes listening {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.15);
    }
}

.robot {
    font-size: 60px;
}

.status {
    margin-top: 30px;
    margin-bottom: 20px;
    color: #8defff;
}

.box {
    min-height: 110px;
    padding: 18px;
    border: 1px solid #00eaff;
    border-radius: 15px;

    background: rgba(0, 234, 255, 0.05);

    color: white;
    line-height: 1.6;

    margin-bottom: 25px;
}

button {
    width: 100%;
    padding: 17px;

    border: none;
    border-radius: 30px;

    background: #00eaff;
    color: #001018;

    font-size: 18px;
    font-weight: bold;

    box-shadow: 0 0 25px #00eaff;

    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

button:disabled {
    opacity: 0.6;
}

.commands {
    margin-top: 20px;
    color: #6f8490;
    font-size: 13px;
    line-height: 1.7;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">JARVIS</div>

    <div class="subtitle">
        Personal AI Voice Assistant
    </div>

    <div class="orb" id="orb">
        <div class="robot">🤖</div>
    </div>

    <div class="status" id="status">
        🟢 Online • Ready
    </div>

    <div class="box" id="response">
        Hello Boss! 👋<br>
        Main aapki command ka wait kar raha hoon.
    </div>

    <button id="talkButton" onclick="startListening()">
        🎙️ TALK TO JARVIS
    </button>

    <div class="commands">
        Try saying:<br>
        "Hello Jarvis" • "Time kya hai" •
        "YouTube kholo" • "Google kholo"
    </div>

</div>


<script>

const statusText = document.getElementById("status");
const responseBox = document.getElementById("response");
const talkButton = document.getElementById("talkButton");
const orb = document.getElementById("orb");


/* =========================
   SPEECH RECOGNITION
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    /*
       Hindi recognition works well
       for Hindi + Hinglish.
    */

    recognition.lang = "hi-IN";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 3;


    recognition.onstart = function() {

        isListening = true;

        statusText.innerText =
            "🎙️ Sun raha hoon...";

        talkButton.innerText =
            "🛑 LISTENING...";

        orb.classList.add("listening");

    };


    recognition.onresult = function(event) {

        let command =
            event.results[0][0].transcript
            .trim()
            .toLowerCase();

        console.log("User said:", command);

        responseBox.innerHTML =
            "<b>You:</b> " + command;

        statusText.innerText =
            "⚡ Processing...";

        processCommand(command);

    };


    recognition.onerror = function(event) {

        console.log(
            "Speech error:",
            event.error
        );

        isListening = false;

        orb.classList.remove("listening");

        talkButton.innerText =
            "🎙️ TALK TO JARVIS";

        statusText.innerText =
            "🟢 Online • Ready";


        if (event.error === "not-allowed") {

            responseBox.innerText =
                "Boss, microphone permission Allow karo.";

        }

        else if (event.error === "no-speech") {

            responseBox.innerText =
                "Boss, mujhe kuch sunai nahi diya. Dobara bolo.";

        }

        else if (event.error === "network") {

            responseBox.innerText =
                "Boss, voice recognition ke liye internet connection check karo.";

        }

        else {

            responseBox.innerText =
                "Boss, voice recognition mein problem aa gayi.";

        }

    };


    recognition.onend = function() {

        isListening = false;

        orb.classList.remove("listening");

        talkButton.innerText =
            "🎙️ TALK TO JARVIS";

        statusText.innerText =
            "🟢 Online • Ready";

    };

}


/* =========================
   START LISTENING
========================= */

function startListening() {

    if (!recognition) {

        alert(
            "Boss, is browser mein voice recognition supported nahi hai."
        );

        return;
    }


    if (isListening) {

        recognition.stop();

        return;
    }


    try {

        recognition.start();

    }

    catch(error) {

        console.log(error);

    }

}


/* =========================
   COMMAND PROCESSOR
========================= */
async function processCommand(command) {

    // Local commands
    if (
        command.includes("youtube") ||
        command.includes("यूट्यूब")
    ) {
        const reply = "Boss, YouTube open kar raha hoon.";
        showReply(reply);
        speak(reply);

        setTimeout(() => {
            window.open("https://www.youtube.com", "_blank");
        }, 1000);

        return;
    }

    if (
        command.includes("google") ||
        command.includes("गूगल")
    ) {
        const reply = "Boss, Google open kar raha hoon.";
        showReply(reply);
        speak(reply);

        setTimeout(() => {
            window.open("https://www.google.com", "_blank");
        }, 1000);

        return;
    }

    // Backend connection
    try {

        statusText.innerText = "🧠 JARVIS AI thinking...";
        talkButton.disabled = true;

        const response = await fetch(
            "https://jarvis-ai-3-q449.onrender.com/ask",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: command
                })
            }
        );

        if (!response.ok) {
            throw new Error("Backend request failed");
        }

        const data = await response.json();

        const reply =
            data.reply ||
            "Boss, backend se reply nahi mila.";

        showReply(reply);
        speak(reply);

    }

    catch (error) {

        console.error("JARVIS Backend Error:", error);

        const reply =
            "Boss, JARVIS backend se connection nahi ho pa raha.";

        showReply(reply);
        speak(reply);

    }

    finally {

        talkButton.disabled = false;
        statusText.innerText =
            "🟢 Online • Ready";

    }
