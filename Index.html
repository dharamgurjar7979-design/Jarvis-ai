<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI Assistant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #02070d;
    color: #00eaff;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}

.title {
    font-size: 42px;
    letter-spacing: 8px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px #00eaff;
}

.subtitle {
    color: #8defff;
    margin-bottom: 35px;
}

.orb {
    width: 190px;
    height: 190px;
    margin: auto;
    border: 4px solid #00eaff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow:
        0 0 20px #00eaff,
        0 0 50px #0077ff,
        inset 0 0 30px #00eaff;
    animation: pulse 2s infinite;
}

.orb.listening {
    animation: listening 0.6s infinite alternate;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08);
    }
}

@keyframes listening {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.15);
    }
}

.robot {
    font-size: 60px;
}

.status {
    margin: 30px 0 20px;
    color: #8defff;
}

.box {
    min-height: 110px;
    padding: 18px;
    margin-bottom: 25px;
    border: 1px solid #00eaff;
    border-radius: 15px;
    background: rgba(0, 234, 255, 0.05);
    color: white;
    line-height: 1.6;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 30px;
    background: #00eaff;
    color: #001018;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 0 25px #00eaff;
}

button:active {
    transform: scale(0.96);
}

button:disabled {
    opacity: 0.6;
}

.commands {
    margin-top: 20px;
    color: #6f8490;
    font-size: 13px;
    line-height: 1.7;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">JARVIS</div>

    <div class="subtitle">
        Personal AI Voice Assistant
    </div>

    <div class="orb" id="orb">
        <div class="robot">🤖</div>
    </div>

    <div class="status" id="status">
        🟢 Online • Ready
    </div>

    <div class="box" id="response">
        Hello Boss! 👋<br>
        Main aapki command ka wait kar raha hoon.
    </div>

    <button id="talkButton">
        🎙️ TALK TO JARVIS
    </button>

    <div class="commands">
        Try saying:<br>
        "Hello Jarvis" • "Time kya hai" •
        "YouTube kholo" • "Google kholo"
    </div>

</div>

<script>
const BACKEND_URL = "https://jarvis-ai-3-q449.onrender.com";

const statusText = document.getElementById("status");
const responseBox = document.getElementById("response");
const talkButton = document.getElementById("talkButton");
const orb = document.getElementById("orb");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;


/* VOICE RECOGNITION */

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function () {

        listening = true;

        statusText.textContent =
            "🎙️ Sun raha hoon...";

        talkButton.textContent =
            "🛑 STOP";

        orb.classList.add("listening");
    };


    recognition.onresult = function (event) {

        const command =
            event.results[0][0].transcript
            .trim()
            .toLowerCase();

        responseBox.innerHTML =
            "<b>You:</b><br>" + command;

        processCommand(command);
    };


    recognition.onerror = function (event) {

        listening = false;

        orb.classList.remove("listening");

        talkButton.textContent =
            "🎙️ TALK TO JARVIS";

        statusText.textContent =
            "⚠️ Voice error";

        if (event.error === "not-allowed") {

            responseBox.innerHTML =
                "<b>JARVIS:</b><br>" +
                "Boss, Chrome microphone permission Allow karo.";

        } else if (event.error === "no-speech") {

            responseBox.innerHTML =
                "<b>JARVIS:</b><br>" +
                "Boss, mujhe kuch sunai nahi diya.";

        } else {

            responseBox.innerHTML =
                "<b>JARVIS:</b><br>" +
                "Voice error: " + event.error;
        }
    };


    recognition.onend = function () {

        listening = false;

        orb.classList.remove("listening");

        talkButton.textContent =
            "🎙️ TALK TO JARVIS";

        if (
            statusText.textContent ===
            "🎙️ Sun raha hoon..."
        ) {
            statusText.textContent =
                "🟢 Online • Ready";
        }
    };

} else {

    statusText.textContent =
        "⚠️ Voice unavailable";

    responseBox.innerHTML =
        "<b>JARVIS:</b><br>" +
        "Boss, is Chrome environment me voice recognition available nahi hai.";
}


/* TALK BUTTON */

talkButton.addEventListener("click", function () {

    if (!recognition) {
        return;
    }

    if (listening) {
        recognition.stop();
        return;
    }

    try {
        recognition.start();
    } catch (error) {
        console.log(error);
    }
});


/* COMMAND PROCESSOR */

async function processCommand(command) {

    if (
        command.includes("youtube") ||
        command.includes("यूट्यूब")
    ) {

        const reply =
            "Boss, YouTube open kar raha hoon.";

        showReply(reply);
        speak(reply);

        setTimeout(function () {
            window.open(
                "https://www.youtube.com",
                "_blank"
            );
        }, 800);

        return;
    }


    if (
        command.includes("google") ||
        command.includes("गूगल")
    ) {

        const reply =
            "Boss, Google open kar raha hoon.";

        showReply(reply);
        speak(reply);

        setTimeout(function () {
            window.open(
                "https://www.google.com",
                "_blank"
            );
        }, 800);

        return;
    }


    if (
        command.includes("time") ||
        command.includes("टाइम") ||
        command.includes("समय")
    ) {

        const reply =
            "Boss, abhi time hai " +
            new Date().toLocaleTimeString("en-IN");

        showReply(reply);
        speak(reply);

        return;
    }


    if (
        command.includes("date") ||
        command.includes("डेट") ||
        command.includes("तारीख")
    ) {

        const reply =
            "Boss, aaj ki date hai " +
            new Date().toLocaleDateString("en-IN");

        showReply(reply);
        speak(reply);

        return;
    }


    /* SEND COMMAND TO BACKEND */

    statusText.textContent =
        "🧠 JARVIS thinking...";

    talkButton.disabled = true;

    try {

        const response =
            await fetch(
                BACKEND_URL + "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: command
                    })
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        const reply =
            data.reply ||
            "Boss, mujhe reply nahi mila.";

        showReply(reply);
        speak(reply);

    } catch (error) {

        console.error(error);

        const reply =
            "Boss, backend se connection nahi ho pa raha.";

        showReply(reply);
        speak(reply);

    } finally {

        talkButton.disabled = false;

        statusText.textContent =
            "🟢 Online • Ready";
    }
}


/* DISPLAY REPLY */

function showReply(text) {

    responseBox.innerHTML =
        "<b>JARVIS:</b><br>" + text;
}


/* VOICE REPLY */

function speak(text) {

    if (!window.speechSynthesis) {
        return;
    }

    window.speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "hi-IN";
    voice.rate = 0.9;
    voice.pitch = 0.9;
    voice.volume = 1;

    voice.onstart = function () {

        statusText.textContent =
            "🔊 JARVIS speaking...";
    };

    voice.onend = function () {

        statusText.textContent =
            "🟢 Online • Ready";
    };

    window.speechSynthesis.speak(voice);
}
</script>

</body>
  </html>
